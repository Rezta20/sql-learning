# 推到 GitHub 的 main 分支後，自動 build 並部署到 GitHub Pages。
# 第一次要到 repo 的 Settings → Pages → Source 選「GitHub Actions」。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (base = /<repo 名稱>/)
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # SPA 路由：直接開 /map 之類的網址時，GitHub Pages 會回 404.html，內容同 index.html
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
